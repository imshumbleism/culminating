<!DOCTYPE html>
<html>
<head>
<title>My Culminating Widget Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: linear-gradient(to bottom, #8B0000, #FF4500);
    color: white;
}

h1 {
    text-align: center;
    padding-top: 20px;
}

p.subtitle {
    text-align: center;
    margin-bottom: 20px;
}

/* ✅ FLEXBOX instead of floats */
#container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 10px;
    gap: 15px;
}

.box {
    width: 300px;
    min-height: 600px;
    padding: 15px;
    border-radius: 15px;
    box-sizing: border-box;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.box:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

#box1 { background-color: #ff9999; }
#box2 { background-color: #99ccff; }
#box3 { background-color: #99ff99; }
#box4 { background-color: #ffe680; color: black; }

h2 {
    text-align: center;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    background: white;
}

button:hover {
    background-color: #ddd;
}

/* small screens fix */
@media (max-width: 700px) {
    .box {
        width: 90%;
    }
}
</style>
</head>

<body>

<h1>My Culminating Widget Dashboard</h1>
<p class="subtitle">Widgets • Weather • Calendar • Tools • Projects</p>

<div id="container">

<!-- WEATHER -->
<div class="box" id="box1">
<h2>Weather</h2>

<a class="weatherwidget-io"
href="https://forecast7.com/en/43d65n79d38/toronto/"
data-label_1="TORONTO"
data-label_2="WEATHER"
data-theme="original">
TORONTO WEATHER
</a>

<script>
!function(d,s,id){
var js,fjs=d.getElementsByTagName(s)[0];
if(!d.getElementById(id)){
js=d.createElement(s);
js.id=id;
js.src='https://weatherwidget.io/js/widget.min.js';
fjs.parentNode.insertBefore(js,fjs);
}
}(document,'script','weatherwidget-io-js');
</script>
</div>

<!-- CALENDAR -->
<div class="box" id="box2">
<h2>Calendar</h2>

<iframe
src="https://calendar.google.com/calendar/embed?src=en.canadian%23holiday%40group.v.calendar.google.com&ctz=America%2FToronto"
width="100%"
height="500">
</iframe>
</div>

<!-- TOOLS -->
<div class="box" id="box3">
<h2>Tools</h2>

<iframe
src="https://openspeedtest.com/Get-widget.php"
width="100%"
height="200">
</iframe>

<br><br>

<iframe
src="https://www.google.com/maps?q=Toronto&output=embed"
width="100%"
height="250">
</iframe>
</div>

<!-- PROJECT -->
<div class="box" id="box4">
<h2>Roller Coaster Project</h2>

<p>Visit my roller coaster builder project:</p>

<button onclick="window.open('https://imshumbleism.github.io/imshumbleism-roller-coaster-builder/')">
Open Project
</button>

<br><br>

<p><b>Features:</b></p>
<ul style="text-align:left;">
<li>Custom coaster design</li>
<li>Loops and hills</li>
<li>Ride mode</li>
<li>Day/Night mode</li>
</ul>
</div>

</div>

</body>
</html>
