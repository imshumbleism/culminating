<!DOCTYPE html>
<html>
<head>
<title>My Widget Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    overflow-x: hidden;
    color: white;

    /* base winter sky */
    background: linear-gradient(to bottom, #0b1a3a, #1e3c72, #2a5298);
}

/* 🌌 AURORA SKY */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        120deg,
        rgba(0,255,200,0.15),
        rgba(120,0,255,0.15),
        rgba(0,120,255,0.15),
        rgba(0,255,120,0.15)
    );
    animation: auroraMove 12s infinite linear;
    filter: blur(60px);
    z-index: 0;
    pointer-events: none;
}

@keyframes auroraMove {
    0% { transform: translate(0,0) rotate(0deg); }
    50% { transform: translate(-10%, -5%) rotate(180deg); }
    100% { transform: translate(0,0) rotate(360deg); }
}

/* ❄️ subtle glow */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent);
    pointer-events: none;
    z-index: 1;
}

h1, p {
    position: relative;
    z-index: 2;
}

h1 {
    text-align: center;
    padding-top: 20px;
}

p.subtitle {
    text-align: center;
    margin-bottom: 20px;
}

/* container */
#container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 10px;
    gap: 15px;
    position: relative;
    z-index: 2;
}

/* 🧊 FROST GLASS PANELS */
.box {
    width: 300px;
    min-height: 600px;
    padding: 15px;
    border-radius: 18px;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);

    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.box:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

h2 {
    text-align: center;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    background: white;
    transition: 0.2s;
}

button:hover {
    background-color: #ddd;
}

/* mobile */
@media (max-width: 700px) {
    .box {
        width: 90%;
    }
}
</style>
</head>

<body>

<h1>My Widget Dashboard</h1>
<p class="subtitle">Widgets • Weather • Calendar • Tools • Projects</p>

<div id="container">

<!-- WEATHER -->
<div class="box hover-sound">
<h2>Weather</h2>

<a class="weatherwidget-io"
href="https://forecast7.com/en/43d65n79d38/toronto/"
data-label_1="TORONTO"
data-label_2="WEATHER"
data-theme="original">
TORONTO WEATHER
</a>

<script>
!function(d,s,id){
var js,fjs=d.getElementsByTagName(s)[0];
if(!d.getElementById(id)){
js=d.createElement(s);
js.id=id;
js.src='https://weatherwidget.io/js/widget.min.js';
fjs.parentNode.insertBefore(js,fjs);
}
}(document,'script','weatherwidget-io-js');
</script>

</div>

<!-- CALENDAR -->
<div class="box hover-sound">
<h2>Calendar</h2>

<iframe
src="https://calendar.google.com/calendar/embed?src=en.canadian%23holiday%40group.v.calendar.google.com&ctz=America%2FToronto"
width="100%"
height="500"></iframe>

</div>

<!-- TOOLS -->
<div class="box hover-sound">
<h2>Tools</h2>

<iframe
src="https://openspeedtest.com/Get-widget.php"
width="100%"
height="200"></iframe>

<br><br>

<iframe
src="https://www.google.com/maps?q=Toronto&output=embed"
width="100%"
height="250"></iframe>

</div>

<!-- PROJECT -->
<div class="box hover-sound">
<h2>Roller Coaster Project</h2>

<p>Visit my roller coaster builder project:</p>

<button onclick="window.open('https://imshumbleism.github.io/imshumbleism-roller-coaster-builder/')">
Open Project
</button>

<br><br>

<p><b>Features:</b></p>
<ul style="text-align:left;">
<li>Custom coaster design</li>
<li>Loops and hills</li>
<li>Ride mode</li>
<li>Custom Day/Night mode</li>
</ul>

</div>

</div>

<!-- 🔊 HOVER SOUND SCRIPT -->
<audio id="hoverSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3" preload="auto"></audio>

<script>
const sound = document.getElementById("hoverSound");

// enable sound after first click (browser rule)
document.body.addEventListener("click", () => {
    sound.play().then(() => {
        sound.pause();
        sound.currentTime = 0;
    }).catch(()=>{});
}, { once: true });

// hover effect
document.querySelectorAll(".hover-sound").forEach(el => {
    el.addEventListener("mouseenter", () => {
        sound.currentTime = 0;
        sound.play();
    });
});
</script>

</body>
</html>
